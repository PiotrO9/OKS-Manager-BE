name: Trigger homelab deploy

on:
  workflow_run:
    workflows:
      - Backend CI
    branches:
      - main
    types:
      - completed

jobs:
  trigger-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy repository workflow
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/PiotrO9/OSK-Manager-DEPLOY/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
